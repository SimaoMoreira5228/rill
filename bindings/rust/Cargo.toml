[package]
name = "rill-media"
version = "2026.11.14"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Safe Rust bindings for the Rill media extractor and downloader"
keywords = ["media", "video", "download", "extractor", "youtube"]
categories = ["multimedia", "api-bindings"]
links = "rill"
build = "build.rs"
include = ["src/**/*", "tests/**/*", "build.rs", "Cargo.toml"]

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1", features = ["rt", "time"], optional = true }
