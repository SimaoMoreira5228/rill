name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            key: linux-x64-gnu
          - os: ubuntu-22.04-arm
            key: linux-arm64-gnu
          - os: macos-15-intel
            key: darwin-x64
          - os: macos-15
            key: darwin-arm64
          - os: windows-latest
            key: win32-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgc-dev libssl-dev libxml2-dev libyaml-dev libpcre2-dev zlib1g-dev python3-pip ninja-build
          python3 -m pip install --user meson

      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install libgc openssl@3 libxml2 pcre2 meson ninja dylibbundler

      - name: Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install make -y --no-progress
          python -m pip install meson ninja

      - name: Windows toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native library, CLI, and static media helper
        shell: bash
        run: |
          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            link_dir=$(dirname "$(find "/c/Program Files/Microsoft Visual Studio" -path '*/HostX64/x64/link.exe' -print -quit)")
            export PATH="$link_dir:$PATH"
          fi

          make media-helper
          make lib
          make cli

      - name: Package CLI and SDK archives
        shell: bash
        env:
          RILL_PLATFORM_KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail

          key="$RILL_PLATFORM_KEY"
          version=$(awk '/^version:/ {print $2}' shard.yml)
          rm -rf "dist/cli-$key" "dist/sdk-$key"
          mkdir -p "dist/cli-$key/bin" "dist/cli-$key/lib" "dist/sdk-$key/bin" "dist/sdk-$key/include" "dist/sdk-$key/bindings/cpp" "dist/sdk-$key/lib"

          if [[ "$key" == win32-* ]]; then
            rill_bin="bin/rill.exe"
            helper="build/rill-media.exe"
          else
            rill_bin="bin/rill"
            helper="build/rill-media"
          fi

          cp "$rill_bin" "dist/cli-$key/bin/$(basename "$rill_bin")"
          cp "$helper" "dist/cli-$key/bin/$(basename "$helper")"
          cp README.md LICENSE NOTICE "dist/cli-$key/"

          cp "$helper" "dist/sdk-$key/bin/$(basename "$helper")"
          cp include/rill.h "dist/sdk-$key/include/rill.h"
          cp bindings/cpp/rill.hpp "dist/sdk-$key/bindings/cpp/rill.hpp"
          cp README.md LICENSE NOTICE "dist/sdk-$key/"

          if [[ "$key" == win32-* ]]; then
            cp build/rill.dll "dist/sdk-$key/lib/rill.dll"
            if [[ -f build/rill.lib ]]; then
              cp build/rill.lib "dist/sdk-$key/lib/rill.lib"
            fi

            crystal_dir=$(dirname "$(command -v crystal)")
            mkdir -p "bindings/node/native/$key" "bindings/bun/native/$key"
            for dll in gc.dll iconv-2.dll libcrypto-4-x64.dll libssl-4-x64.dll libxml2.dll libz.dll pcre2-8.dll; do
              if [[ ! -f "$crystal_dir/$dll" ]]; then
                echo "Missing Windows runtime library: $crystal_dir/$dll" >&2
                exit 1
              fi
              for dest in "dist/cli-$key/bin" "dist/sdk-$key/lib" "bindings/node/native/$key" "bindings/bun/native/$key"; do
                cp "$crystal_dir/$dll" "$dest"/
              done
            done
          elif [[ "$key" == darwin-* ]]; then
            mkdir -p "dist/sdk-$key/lib-tmp"
            cp build/librill.dylib "dist/sdk-$key/lib-tmp/librill.dylib"

            dylibbundler -od -b -x "dist/cli-$key/bin/rill" -d "dist/cli-$key/lib" -p "@executable_path/../lib"
            dylibbundler -od -b -x "dist/sdk-$key/lib-tmp/librill.dylib" -d "dist/sdk-$key/lib" -p "@loader_path"
            cp "dist/sdk-$key/lib-tmp/librill.dylib" "dist/sdk-$key/lib/librill.dylib"
            rm -rf "dist/sdk-$key/lib-tmp"
          else
            cp build/librill.so "dist/sdk-$key/lib/librill.so"
          fi

          tar -czf "dist/rill-${version}-${key}.tar.gz" -C "dist/cli-$key" .
          tar -czf "dist/librill-${version}-${key}.tar.gz" -C "dist/sdk-$key" .

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.key }}
          path: dist/rill-*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.key }}
          path: dist/librill-*.tar.gz
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Node addon
        working-directory: bindings/node
        run: npx --yes node-gyp rebuild

      - name: Package Node artifacts
        working-directory: bindings/node
        env:
          RILL_PLATFORM_KEY: ${{ matrix.key }}
        run: node scripts/package-native.js

      - name: Package Bun artifacts
        working-directory: bindings/bun
        env:
          RILL_PLATFORM_KEY: ${{ matrix.key }}
        run: node scripts/package-native.cjs

      - name: Test Windows binaries
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -x

          ./bin/rill.exe --version
          ./bin/rill.exe extract "https://example.com/clip.mp4" > /dev/null
          ./build/rill-media.exe --help > /dev/null

          cat > build/abi_test.c <<'EOF'
          #include <stdio.h>
          #include "rill.h"
          int main(void) {
            if (rill_abi_version() != 2) return 1;
            puts("c abi ok");
            return 0;
          }
          EOF

          cat > build/abi_test.bat <<'EOF'
          @echo off
          cl /nologo /Iinclude /Fo:build\abi_test.obj /Fe:build\abi_test.exe build\abi_test.c /link /LIBPATH:build rill.lib
          EOF

          cmd //c build\\abi_test.bat
          ./build/abi_test.exe

          (cd bindings/node && node smoke.js)
          (cd bindings/bun && bun run smoke.ts)

      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.key }}
          path: bindings/node/native/${{ matrix.key }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: bun-${{ matrix.key }}
          path: bindings/bun/native/${{ matrix.key }}
          if-no-files-found: error

  assemble:
    needs: native
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: artifacts/node

      - uses: actions/download-artifact@v4
        with:
          pattern: bun-*
          path: artifacts/bun

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: artifacts/cli

      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: artifacts/sdk

      - name: Assemble native directories
        run: |
          for source in artifacts/node/*; do
            key=${source##*/node-}
            mkdir -p "bindings/node/native/$key"
            cp -a "$source"/. "bindings/node/native/$key/"
          done

          for source in artifacts/bun/*; do
            key=${source##*/bun-}
            mkdir -p "bindings/bun/native/$key"
            cp -a "$source"/. "bindings/bun/native/$key/"
          done

          mkdir -p dist
          cp artifacts/cli/*/*.tar.gz dist/
          cp artifacts/sdk/*/*.tar.gz dist/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Pack npm packages
        run: |
          mkdir -p dist
          (cd bindings/node && npm pack --pack-destination ../../dist)
          (cd bindings/bun && bun pm pack --destination ../../dist)
          (cd dist && sha256sum *.tar.gz *.tgz > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    needs: assemble
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install current npm
        run: npm install --global npm@latest

      - name: Publish npm packages
        run: |
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          for package in dist/*.tgz; do
            npm publish "./$package" --access public
          done

      - uses: crystal-lang/install-crystal@v1

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgc-dev libssl-dev libxml2-dev libyaml-dev libpcre2-dev zlib1g-dev

      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-auth

      - name: Publish Rust crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --locked
