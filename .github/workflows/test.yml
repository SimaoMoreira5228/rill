name: test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgc-dev libssl-dev libxml2-dev libyaml-dev libpcre2-dev zlib1g-dev

      - name: Format
        run: |
          crystal tool format --check src spec
          cargo fmt --all -- --check

      - name: Crystal specs
        run: crystal spec

      - name: Native library
        run: make lib

      - name: C, C++, and Rust bindings
        run: |
          make test-c-api
          make test-cpp
          make test-rust
          make test-rust RUST_FEATURES="--features tokio"

      - name: Cross-target checks
        run: make check-targets

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Node binding
        run: make test-node

      - uses: oven-sh/setup-bun@v2

      - name: Bun binding
        run: make test-bun
