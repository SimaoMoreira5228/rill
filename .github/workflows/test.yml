name: test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgc-dev libssl-dev libxml2-dev libyaml-dev libpcre2-dev zlib1g-dev ffmpeg ninja-build pipx
          pipx install meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Format
        run: |
          crystal tool format --check src spec
          cargo fmt --all -- --check

      - name: Configure
        run: meson setup build --buildtype=release

      - name: Build
        run: meson compile -C build rill-media librill rill

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Test
        run: meson test -C build --print-errorlogs
